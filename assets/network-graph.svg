<svg width="760" height="520" viewBox="0 0 760 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous network operations concept diagram</title>
  <desc id="desc">A network of connected nodes surrounding a central agent loop from evidence to reasoning, action, and verification.</desc>
